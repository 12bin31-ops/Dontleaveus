version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-churn-app
    environment:
      PYTHONUNBUFFERED: 1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
    ports:
      - "8501:8501"  # Streamlit
    depends_on:
      - db
    networks:
      - churn-network
    restart: unless-stopped
    
  # PostgreSQL database (optional)
  db:
    image: postgres:15-alpine
    container_name: churn-db
    environment:
      POSTGRES_DB: churn_db
      POSTGRES_USER: churn_user
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - churn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: churn-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - churn-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Log aggregation with Loki (optional)
  loki:
    image: grafana/loki:latest
    container_name: churn-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - churn-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  loki_data:

networks:
  churn-network:
    driver: bridge
